name: CMake on Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.runner }}

    strategy:
      # Do not cancel the other combinations when one fails.
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    cc: gcc,   cxx: g++ }
          - { runner: ubuntu-latest,    cc: clang, cxx: clang++ }
          - { runner: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { runner: ubuntu-24.04-arm, cc: clang, cxx: clang++ }

    steps:
    - uses: actions/checkout@v6

    - name: Install OpenCV and Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y libopencv-dev clang

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -DCMAKE_C_COMPILER=${{ matrix.cc }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure
