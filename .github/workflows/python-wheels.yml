name: Python wheels

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

# Least privilege: the workflow only reads the repository (actions/checkout).
permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # The tag must match __version__ and the CMake project version, so a
    # release cannot publish a mismatched version.
    - name: Check the tag matches the package and project versions
      if: startsWith(github.ref, 'refs/tags/v')
      run: python bindings/python/check_version.py "$GITHUB_REF_NAME"

  wheel-linux:
    needs: check-version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # Built inside the manylinux image so the wheel keeps a low glibc
    # requirement; the script also runs auditwheel.
    - name: Build the wheel inside manylinux
      run: |
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e HOME=/tmp \
          -u "$(id -u):$(id -g)" \
          quay.io/pypa/manylinux_2_28_x86_64 \
          bash /work/bindings/python/manylinux_build.sh dist

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install and smoke-test the wheel
      run: |
        python -m pip install --find-links dist mandelbrot-explorer
        python -c "import mandelbrot_explorer as me; colors = me.render_frame(160, 90, max_iterations=32); assert colors.shape == (90, 160, 3), colors.shape; print('wheel OK', me.__version__)"

    - uses: actions/upload-artifact@v4
      with:
        name: wheel-linux
        path: dist/*.whl

  wheel:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
          - runner: macos-14

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # The core library has no OpenCV dependency, so the wheel job can skip it.
    - name: Configure (core only)
      run: cmake -S . -B build-wheel -DMANDELBROT_EXPLORER_WITH_VIDEO=OFF -DCMAKE_BUILD_TYPE=Release

    - name: Build the core shared library
      run: cmake --build build-wheel --config Release --target mandelbrot_explorer

    - name: Stage the native library into the package
      run: python bindings/python/stage_libraries.py --build-dir build-wheel

    - name: Build the wheel
      run: |
        python -m pip install --upgrade build wheel
        python -m build --wheel bindings/python --outdir dist

    # setuptools tags a pure-Python wheel as py3-none-any, but the package
    # bundles a native library, so retag it with the host platform.
    - name: Retag the wheel for this platform
      run: python bindings/python/retag_wheel.py dist

    - name: Install and smoke-test the wheel
      run: |
        python -m pip install --find-links dist mandelbrot-explorer
        python -c "import mandelbrot_explorer as me; colors = me.render_frame(160, 90, max_iterations=32); assert colors.shape == (90, 160, 3), colors.shape; print('wheel OK', me.__version__)"

    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.runner }}
        path: dist/*.whl

  release:
    needs: [wheel, wheel-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        merge-multiple: true
        path: dist

    # Idempotent: re-running a tag build updates the existing release. --repo is
    # required because this job does not check the repository out, so gh has no
    # git remote to infer the repository from.
    - name: Create the release with the wheels
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        gh release upload "$GITHUB_REF_NAME" dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [wheel, wheel-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: configure the matching publisher at
    # https://pypi.org/manage/account/publishing/ (project mandelbrot-explorer,
    # owner underorangetree, workflow python-wheels.yml, environment pypi).
    # No API token is stored in the repository.
    environment:
      name: pypi
      url: https://pypi.org/p/mandelbrot-explorer
    permissions:
      id-token: write      # Trusted Publishing (OIDC)
      attestations: write  # PEP 740 provenance for the uploaded wheels
      contents: read

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheel-*
        merge-multiple: true
        path: dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true
