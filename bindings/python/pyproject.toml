[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mandelbrot-explorer"
dynamic = ["version"]
description = "Python binding for the MandelbrotExplorer C ABI (ctypes + numpy)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["mandelbrot", "fractal", "rendering", "simd", "ctypes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/underorangetree/MandelbrotExplorer"
Documentation = "https://github.com/underorangetree/MandelbrotExplorer/blob/main/docs/c-api.md"
Source = "https://github.com/underorangetree/MandelbrotExplorer"

[tool.setuptools]
packages = ["mandelbrot_explorer"]

[tool.setuptools.dynamic]
version = {attr = "mandelbrot_explorer.__version__"}

# The native libraries are not built by pip: stage them with
# bindings/python/stage_libraries.py before building a wheel.
[tool.setuptools.package-data]
mandelbrot_explorer = ["*.dll", "*.so", "*.so.*", "*.dylib"]
